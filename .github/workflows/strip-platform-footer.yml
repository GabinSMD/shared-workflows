name: Strip platform footer

# The Claude Code cloud platform appends "_Generated by [Claude Code](…)_" to
# a PR body server-side, and puts it back when the session edits the body
# through it (seen on SIMOND-ANCE-BROS/ecole-saas#466). An edit made here, with
# the workflow token, does not go through the platform, and does not trigger
# another workflow run.
# Reusable and opt-in: the caller's job must grant `pull-requests: write`
# (see README.md). Kept apart from pr-conventions on purpose: a nested job
# asking for more than its caller grants makes the whole workflow fail to start.

on:
  workflow_call:

permissions: {}

jobs:
  strip:
    name: Remove platform footer
    if: >-
      github.event_name == 'pull_request' &&
      contains(github.event.pull_request.body, 'Generated by [Claude Code](')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      pull-requests: write
    steps:
      - name: Strip the footer from the PR body
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$NUMBER" --jq .body > body.md
          python3 - <<'PY'
          import re
          body = open("body.md", encoding="utf-8").read()
          new = re.sub(r"(\n\s*---\s*)?\n*_Generated by \[Claude Code\]\([^)]*\)_\s*$", "", body).rstrip() + "\n"
          open("new.md", "w", encoding="utf-8").write(new)
          PY
          if cmp -s body.md new.md; then
            echo "No footer at the end of the body: nothing to do."
          else
            gh api -X PATCH "repos/$REPO/pulls/$NUMBER" -F body=@new.md --silent
            echo "Footer removed."
          fi
